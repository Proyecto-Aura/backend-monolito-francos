##################
#     CONFIG     #
##################
name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

# environment
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: francos-backend

##################
#      JOBS      #
##################
jobs:
  # CI para probar la integracion en main
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  # Publish
  publish:
    name: publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Permite al job pedir el carnet OIDC a GitHub

    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::075367015000:role/francos-github-actions-role # arn del role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
